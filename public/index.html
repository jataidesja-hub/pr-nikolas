<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calaram meu Nordeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --g:#00c853; --y:#ffd600; --b:#1a4bff; }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { background: #000; color: #fff; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* bandeira de fundo, bem escura, com parallax */
  .flag { position: fixed; inset: -10% 0; z-index: 0; opacity: .09; pointer-events: none; will-change: transform;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 504' preserveAspectRatio='xMidYMid slice'><rect width='720' height='504' fill='%23009c3b'/><polygon points='360,42 678,252 360,462 42,252' fill='%23ffdf00'/><circle cx='360' cy='252' r='109' fill='%23002776'/><path d='M254 222 Q360 190 466 262 L463 276 Q360 214 257 247Z' fill='%23fff'/></svg>") center/cover no-repeat;
    filter: saturate(.8) blur(1px); }
  .vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 20%, #000 85%); }
  .grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
  #bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 20;
    background: linear-gradient(90deg, var(--g), var(--y), var(--b)); box-shadow: 0 0 12px var(--y); }

  /* hero */
  header { position: relative; z-index: 2; min-height: 78vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 16px; }
  .eyebrow { font-size: .75rem; letter-spacing: .5em; text-transform: uppercase; color: #777; opacity: 0; animation: fade 1.2s .2s forwards; }
  h1 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: .95;
    font-size: clamp(3rem, 13vw, 9rem); margin: 18px 0; letter-spacing: .02em; }
  h1 .line { display: block; }
  h1 .ch { display: inline-block; opacity: 0; transform: translateY(60px) rotateX(-90deg) scale(.8); filter: blur(12px);
    animation: letter .9s cubic-bezier(.2,.9,.2,1) forwards; animation-delay: calc(.4s + var(--i) * .06s);
    background: linear-gradient(100deg, #fff 0%, var(--y) 30%, var(--g) 55%, #fff 80%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; }
  h1.shine .ch { animation: letter .9s cubic-bezier(.2,.9,.2,1) forwards, shine 5s linear infinite; animation-delay: calc(.4s + var(--i) * .06s), calc(1.8s + var(--i) * .05s); }
  h1 .space { width: .28em; }
  .glow { position: absolute; width: 60vmin; height: 60vmin; border-radius: 50%; filter: blur(90px); opacity: .22; z-index: -1; animation: pulse 6s ease-in-out infinite; }
  .glow.a { background: var(--g); left: 12%; top: 25%; }
  .glow.b { background: var(--y); right: 12%; top: 35%; animation-delay: 3s; }
  .tag-line { color: #8a8a8a; font-weight: 300; letter-spacing: .25em; text-transform: uppercase; font-size: .8rem; opacity: 0; animation: fade 1.2s 2s forwards; }
  .tag-line b { color: var(--y); font-weight: 600; }
  .ig { margin-top: 34px; display: inline-flex; align-items: center; gap: 10px; padding: 13px 26px; border-radius: 40px; text-decoration: none; color: #fff;
    font-size: .72rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; border: 1px solid rgba(255,214,0,.45);
    background: rgba(10,10,10,.6); backdrop-filter: blur(8px); opacity: 0; animation: fade 1s 2.3s forwards; position: relative; overflow: hidden;
    transition: transform .25s, box-shadow .25s, color .25s, background .25s; }
  .ig svg { width: 18px; height: 18px; fill: currentColor; }
  .ig::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,214,0,.25), transparent 70%); transform: translateX(-100%); animation: sweep 3.5s 3s infinite; }
  .ig:hover { transform: translateY(-3px) scale(1.04); color: #000; background: var(--y); box-shadow: 0 0 40px rgba(255,214,0,.35); }
  @keyframes sweep { to { transform: translateX(100%); } }
  .scroll { margin-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; animation: fade 1s 2.4s forwards; }
  .scroll span { font-size: .7rem; letter-spacing: .4em; text-transform: uppercase; color: #8a8a8a; }
  .scroll i { width: 12px; height: 12px; border-right: 2px solid var(--y); border-bottom: 2px solid var(--y); transform: rotate(45deg); animation: bounce 1.6s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(45deg); opacity: .4; } 50% { transform: translateY(8px) rotate(45deg); opacity: 1; } }
  @keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes shine { to { background-position: -250% 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes pulse { 50% { transform: scale(1.25); opacity: .1; } }
  @keyframes wheel { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(14px); } }

  /* álbum */
  main { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 0 16px 120px; display: flex; flex-direction: column; gap: 56px; }
  .item { position: relative; background: #070707; border: 1px solid #1b1b1b; border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.9);
    opacity: 0; transform: translateY(90px) scale(.94); filter: blur(8px);
    transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1), filter .9s ease, box-shadow .4s, border-color .4s; }
  .item:nth-child(even) { transform: translateY(90px) scale(.94) rotate(.6deg); }
  .item:nth-child(odd) { transform: translateY(90px) scale(.94) rotate(-.6deg); }
  .item.in { opacity: 1; transform: none; filter: none; }
  .item:hover { border-color: #333; box-shadow: 0 30px 90px rgba(0,0,0,.9), 0 0 50px rgba(255,214,0,.06); }
  .item.main { border-color: rgba(255,214,0,.45); box-shadow: 0 0 80px rgba(255,214,0,.1), 0 30px 80px #000; }
  .item video, .item img { display: block; width: 100%; max-height: 82vh; object-fit: contain; background: #000; }
  .item img { cursor: zoom-in; will-change: transform, opacity; }
  .car { container-type: inline-size; position: relative; will-change: transform, opacity; }
  .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    padding: 0 14cqw; cursor: grab; user-select: none; }
  .track.drag { scroll-snap-type: none; cursor: grabbing; }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 72cqw; scroll-snap-align: center; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; background: #000; transition: transform .15s linear, opacity .15s linear; }
  .slide img { max-height: 82vh; border-radius: 10px; }
  .dots { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 7px; z-index: 3; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #555; transition: all .3s; }
  .dots i.on { background: var(--y); width: 20px; border-radius: 6px; }
  .snd { position: absolute; top: 14px; right: 14px; z-index: 3; border: 1px solid rgba(255,214,0,.5); background: rgba(0,0,0,.7); color: #fff; backdrop-filter: blur(6px);
    padding: 8px 14px; border-radius: 30px; font: inherit; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; animation: blink 2s infinite; }
  .cap { padding: 14px 20px; font-size: .78rem; color: #777; display: flex; justify-content: space-between; align-items: center; letter-spacing: .12em; text-transform: uppercase; }
  .cap .n { color: #444; font-family: 'Anton'; font-size: 1.1rem; letter-spacing: .05em; }
  .tag { color: #000; background: var(--y); padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: .65rem; }
  .empty { text-align: center; color: #666; padding: 60px 0; }
  footer { position: relative; z-index: 2; text-align: center; padding: 30px 0 70px; font-family: 'Anton'; letter-spacing: .3em; color: #333; text-transform: uppercase; }
  footer small { display: block; margin-top: 14px; font-family: 'Inter', sans-serif; font-size: .6rem; letter-spacing: .1em; text-transform: none; color: #444; }
  #visits { position: fixed; right: 18px; bottom: 18px; z-index: 15; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: 40px; background: rgba(8,8,8,.75); border: 1px solid #262626; backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,.8), 0 0 24px rgba(255,214,0,.08); font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; color: #888;
    will-change: transform; transition: transform .25s ease-out; }
  #visits .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); animation: blink 1.6s infinite; }
  #visits b { font-family: 'Anton'; font-weight: 400; font-size: 1.25rem; letter-spacing: .06em; color: var(--y); }
  .views { display: inline-flex; align-items: center; gap: 6px; color: #888; }
  .views svg { width: 14px; height: 14px; fill: var(--y); }
  .views b { font-weight: 600; color: #ccc; }
  .tick { animation: tick .6s ease-out; }
  @keyframes tick { 0% { transform: scale(1.5); color: #fff; text-shadow: 0 0 14px var(--y); } 100% { transform: scale(1); } }
  .views b, #vcount { display: inline-block; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (max-width: 520px) { #visits { right: 10px; bottom: 10px; padding: 8px 12px; } }
  #refresh { position: fixed; left: 18px; bottom: 18px; z-index: 15; display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 10px 16px; border-radius: 40px; background: rgba(8,8,8,.75); border: 1px solid #262626; backdrop-filter: blur(10px);
    color: #888; font: inherit; font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,.8);
    transition: color .2s, border-color .2s; }
  #refresh:hover { color: var(--y); border-color: rgba(255,214,0,.5); }
  #refresh svg { width: 14px; height: 14px; fill: currentColor; transition: transform .6s; }
  #refresh:hover svg { transform: rotate(180deg); }
  #refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 520px) { #refresh { left: 10px; bottom: 10px; padding: 8px 12px; } }
  #lb { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 30; display: none; align-items: center; justify-content: center; cursor: zoom-out; }
  #lb img { max-width: 96vw; max-height: 96vh; animation: fade .3s; }
  #lb.on { display: flex; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div class="flag" id="flag"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div id="bar"></div>
<header>
  <div class="glow a"></div><div class="glow b"></div>
  <div class="eyebrow">Álbum</div>
  <h1 id="title" aria-label="Calaram meu Nordeste"></h1>
  <div class="tag-line">Uma voz que <b>ninguém</b> vai calar</div>
  <a class="ig" href="https://www.instagram.com/nikolasferreiradm" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm0 2a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H7zm5 3.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9zm0 2a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM17.5 6a1 1 0 110 2 1 1 0 010-2z"/></svg>Siga o Nikolas Ferreira no Instagram</a>
  <div class="scroll"><span>Role para baixo</span><i></i></div>
</header>
<main id="album"></main>
<footer>Calaram meu Nordeste<small>Developed by Josias Ataide, sem fins lucrativos</small></footer>
<div id="visits"><span class="dot"></span><span>Acessos</span><b id="vcount">&mdash;</b></div>
<button id="refresh" type="button" onclick="this.classList.add('spin');setTimeout(()=>location.reload(),200)"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>Atualizar</button>
<div id="lb"><img alt=""></div>
<script>
// título animado letra por letra
(function () {
  const h = document.getElementById('title');
  let i = 0;
  ['Calaram meu', 'Nordeste'].forEach(txt => {
    const line = document.createElement('span');
    line.className = 'line';
    [...txt].forEach(c => {
      const s = document.createElement('span');
      s.className = 'ch' + (c === ' ' ? ' space' : '');
      s.textContent = c === ' ' ? '\u00a0' : c;
      s.style.setProperty('--i', i++);
      line.appendChild(s);
    });
    h.appendChild(line);
  });
  setTimeout(() => h.classList.add('shine'), 2500);
})();

const album = document.getElementById('album');
const lb = document.getElementById('lb');
lb.onclick = () => lb.classList.remove('on');
document.addEventListener('keydown', e => e.key === 'Escape' && lb.classList.remove('on'));

// barra de progresso + parallax
// contadores globais (abacus.jasoncameron.dev)
const NS = /^(localhost|127\.)/.test(location.hostname) ? 'calaram-nordeste-dev' : 'calaram-nordeste';
const API = 'https://abacus.jasoncameron.dev';
const fmt = n => Number(n).toLocaleString('pt-BR');
const slug = s => s.replace(/\.[^.]+$/, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
function counter(action, key) {
  return fetch(`${API}/${action}/${NS}/${key}`)
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && typeof j.value === 'number') ? j.value : null)
    .catch(() => null);
}
const vis = document.getElementById('visits');
const pollers = [];
function setNum(el, v) {
  if (v === null) return;
  const cur = Number(el.dataset.v || 0);
  if (v < cur || v === cur && el.dataset.v) return; // contagem so cresce; ignora respostas ruins
  el.dataset.v = v;
  el.textContent = fmt(v);
  el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
}
const vcount = document.getElementById('vcount');
const pageRefresh = () => counter('get', 'acessos-pagina').then(v => setNum(vcount, v));
// "tempo real": consulta a cada 3s (pausa com aba oculta; videos so se visiveis)
const seen = new Set();
const vio = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? seen.add(e.target) : seen.delete(e.target)));
setInterval(() => {
  if (document.hidden) return;
  pageRefresh();
  pollers.forEach(p => { if (seen.has(p.el)) p.run(); });
}, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pageRefresh(); pollers.forEach(p => seen.has(p.el) && p.run()); } });
(function () {
  const first = !sessionStorage.getItem('visitado'); // conta cada nova entrada (sessão)
  sessionStorage.setItem('visitado', '1');
  counter(first ? 'hit' : 'get', 'acessos-pagina').then(v => {
    if (v === null) { vis.style.display = 'none'; return; }
    setNum(document.getElementById('vcount'), v);
  });
})();

const bar = document.getElementById('bar'), flag = document.getElementById('flag');
function onScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
  flag.style.transform = `translateY(${-scrollY * .08}px) scale(${1 + scrollY / 12000})`;
  vis.style.transform = `translateY(${Math.sin(scrollY / 160) * 8}px)`;
}
addEventListener('scroll', onScroll, { passive: true }); onScroll();

const imgs = [], videos = [], autoEls = new Map();
let soundOn = false;
function enableSound() { soundOn = true; videos.forEach(v => v.muted = false); }
// primeiro toque/clique em qualquer lugar libera o som
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { if (!soundOn) enableSound(); }, { once: false, passive: true }));

// autoplay ao rolar: apenas UM video por vez (o mais proximo do centro, com >=55% visivel)
let apBusy = false;
function updateAuto() {
  apBusy = false;
  let best = null, bestD = Infinity;
  autoEls.forEach((v, card) => {
    const r = card.getBoundingClientRect();
    const vis = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
    if (r.height > 0 && vis / Math.min(r.height, innerHeight) >= .55) {
      const d = Math.abs(r.top + r.height / 2 - innerHeight / 2);
      if (d < bestD) { bestD = d; best = v; }
    }
  });
  autoEls.forEach(v => { if (v !== best && !v.paused) v.pause(); });
  if (best && best.paused && !best.ended && !best.dataset.userPaused) {
    best.muted = !soundOn;
    best.play().catch(() => { best.muted = true; best.play().catch(() => {}); });
  }
}
const queueAuto = () => { if (!apBusy) { apBusy = true; requestAnimationFrame(updateAuto); } };
addEventListener('scroll', queueAuto, { passive: true });
addEventListener('resize', queueAuto);

// imagens expandem conforme chegam ao centro da tela
function growImgs() {
  const mid = innerHeight / 2;
  imgs.forEach(im => {
    const r = im.getBoundingClientRect();
    const dist = Math.abs(r.top + r.height / 2 - mid) / (innerHeight * .75);
    const t = Math.max(0, 1 - dist);
    im.style.transform = `scale(${(.72 + .28 * t).toFixed(3)})`;
    im.style.opacity = (.35 + .65 * t).toFixed(3);
  });
}
addEventListener('scroll', growImgs, { passive: true });
addEventListener('resize', growImgs);

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add('in');
}), { threshold: .12 });

// carrossel infinito (grupo de fotos = subpasta dentro de midia): fotos vizinhas aparecem parcialmente, ao arrastar a foto vai pro centro
function buildCarousel(g) {
  const n = g.slides.length;
  const car = document.createElement('div'); car.className = 'car';
  const track = document.createElement('div'); track.className = 'track';
  let moved = false;
  const mk = s => {
    const w = document.createElement('div'); w.className = 'slide';
    const im = document.createElement('img'); im.src = s.url; im.alt = s.name; im.loading = 'lazy'; im.draggable = false;
    im.onclick = () => { if (moved) return; lb.querySelector('img').src = s.url; lb.classList.add('on'); };
    w.appendChild(im); return w;
  };
  [g.slides[n - 1], ...g.slides, g.slides[0]].forEach(s => track.appendChild(mk(s)));
  const dots = document.createElement('div'); dots.className = 'dots';
  for (let i = 0; i < n; i++) dots.appendChild(document.createElement('i'));
  car.append(track, dots);
  const SW = () => track.firstChild.clientWidth || 1;
  const pos = () => track.scrollLeft / SW();
  const idx = () => Math.round(pos());
  const jump = i => track.scrollTo({ left: i * SW(), behavior: 'instant' });
  const paint = () => {
    const p = pos();
    const k = ((idx() - 1) % n + n) % n;
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i === k));
    [...track.children].forEach((w, i) => {
      const t = Math.min(1, Math.abs(i - p));
      w.style.transform = `scale(${(1 - .12 * t).toFixed(3)})`;
      w.style.opacity = (1 - .55 * t).toFixed(3);
    });
  };
  let t;
  track.addEventListener('scroll', () => {
    paint();
    clearTimeout(t);
    t = setTimeout(() => { const i = idx(); if (i === 0) jump(n); else if (i === n + 1) jump(1); }, 120);
  }, { passive: true });
  // arrastar com o mouse (no celular o toque ja funciona)
  let down = false, sx = 0, sl = 0;
  track.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; sx = e.clientX; sl = track.scrollLeft; track.classList.add('drag'); });
  addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - sx; if (Math.abs(dx) > 5) moved = true; track.scrollLeft = sl - dx; });
  addEventListener('pointerup', () => {
    if (!down) return; down = false; track.classList.remove('drag');
    track.scrollTo({ left: idx() * SW(), behavior: 'smooth' });
    setTimeout(() => { moved = false; }, 50);
  });
  addEventListener('resize', () => jump(Math.max(1, Math.min(n, idx()))));
  setTimeout(() => { jump(1); paint(); }, 50);
  new ResizeObserver(() => { if (idx() === 0) jump(1); paint(); }).observe(track);
  return car;
}

fetch('/api/media').then(r => { if (!r.ok || !(r.headers.get('content-type')||'').includes('json')) throw 0; return r.json(); })
  .catch(() => fetch('/media.json').then(r => r.json()))
  .then(items => {
  if (!items.length) { album.innerHTML = '<div class="empty">Coloque fotos e vídeos na pasta <b>midia</b> e recarregue.</div>'; return; }
  let firstVideo = true;
  items.forEach((it, idx) => {
    const d = document.createElement('div');
    d.className = 'item';
    let el;
    if (it.type === 'video') {
      el = document.createElement('video');
      el.src = it.url; el.controls = true; el.preload = 'metadata'; el.playsInline = true;
      if (firstVideo) { d.classList.add('main'); firstVideo = false; }
    } else if (it.type === 'group') {
      el = buildCarousel(it);
      imgs.push(el);
    } else {
      el = document.createElement('img');
      el.src = it.url; el.loading = 'lazy'; el.alt = it.name;
      el.onclick = () => { lb.querySelector('img').src = it.url; lb.classList.add('on'); };
      imgs.push(el);
    }
    const cap = document.createElement('div');
    cap.className = 'cap';
    const isMain = d.classList.contains('main');
    cap.innerHTML = `<span class="n">${String(idx + 1).padStart(2, '0')}</span><span>Calaram meu Nordeste</span>` + (isMain ? '<span class="tag">Principal</span>' : '<span></span>');
    if (it.type === 'video') {
      const key = it.key || ('video-' + slug(it.name));
      const views = document.createElement('span');
      views.className = 'views';
      views.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"/></svg><b>0</b> visualizações';
      const num = views.querySelector('b');
      const refreshNum = () => counter('get', key).then(v => setNum(num, v));
      refreshNum();
      pollers.push({ el: d, run: refreshNum }); // atualizacao ao vivo (so cards visiveis)
      let fresh = true; // true = proximo play conta (inicio ou apos terminar)
      el.addEventListener('ended', () => { fresh = true; });
      el.muted = !soundOn; videos.push(el);
      // botao de som (autoplay do navegador exige iniciar mudo)
      const snd = document.createElement('button');
      snd.type = 'button'; snd.className = 'snd'; snd.textContent = '🔇 Ativar som';
      snd.onclick = () => enableSound();
      d.appendChild(snd);
      el.addEventListener('volumechange', () => { snd.style.display = el.muted ? '' : 'none'; });
      snd.style.display = el.muted ? '' : 'none';
      autoEls.set(d, el);
      let pending = false;
      el.addEventListener('timeupdate', () => {
        // conta apos 2s assistidos (autoplay ou play manual); tenta de novo se falhar
        if (!fresh || pending || el.currentTime < 2) return;
        pending = true;
        counter('hit', key).then(v => {
          if (v === null) { setTimeout(() => { pending = false; }, 3000); return; } // falhou: tenta de novo em 3s
          pending = false;
          fresh = false;
          setNum(num, v);
        });
      });
      cap.replaceChild(views, cap.lastElementChild);
    }
    d.append(el, cap);
    album.appendChild(d);
    io.observe(d); vio.observe(d);
    if (autoEls.has(d)) el.addEventListener('loadedmetadata', queueAuto);
  });
  growImgs();
  setTimeout(queueAuto, 800);
});
</script>
</body>
</html>
