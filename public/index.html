<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calaram meu Nordeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --g:#00c853; --y:#ffd600; --b:#1a4bff; }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { background: #000; color: #fff; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* bandeira de fundo, bem escura, com parallax */
  .flag { position: fixed; inset: -10% 0; z-index: 0; opacity: .09; pointer-events: none; will-change: transform;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 504' preserveAspectRatio='xMidYMid slice'><rect width='720' height='504' fill='%23009c3b'/><polygon points='360,42 678,252 360,462 42,252' fill='%23ffdf00'/><circle cx='360' cy='252' r='109' fill='%23002776'/><path d='M254 222 Q360 190 466 262 L463 276 Q360 214 257 247Z' fill='%23fff'/></svg>") center/cover no-repeat;
    filter: saturate(.8) blur(1px); }
  .vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 20%, #000 85%); }
  .grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
  #bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 20;
    background: linear-gradient(90deg, var(--g), var(--y), var(--b)); box-shadow: 0 0 12px var(--y); }

  /* hero */
  header { position: relative; z-index: 2; min-height: 78vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 16px; }
  .eyebrow { font-size: .75rem; letter-spacing: .5em; text-transform: uppercase; color: #777; opacity: 0; animation: fade 1.2s .2s forwards; }
  h1 { font-family: 'Anton', Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: .95;
    font-size: clamp(3rem, 13vw, 9rem); margin: 18px 0; letter-spacing: .02em; }
  h1 .line { display: block; }
  h1 .ch { display: inline-block; opacity: 0; transform: translateY(60px) rotateX(-90deg) scale(.8); filter: blur(12px);
    animation: letter .9s cubic-bezier(.2,.9,.2,1) forwards; animation-delay: calc(.4s + var(--i) * .06s);
    background: linear-gradient(100deg, #fff 0%, var(--y) 30%, var(--g) 55%, #fff 80%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; }
  h1.shine .ch { animation: letter .9s cubic-bezier(.2,.9,.2,1) forwards, shine 5s linear infinite; animation-delay: calc(.4s + var(--i) * .06s), calc(1.8s + var(--i) * .05s); }
  h1 .space { width: .28em; }
  .glow { position: absolute; width: 60vmin; height: 60vmin; border-radius: 50%; filter: blur(90px); opacity: .22; z-index: -1; animation: pulse 6s ease-in-out infinite; }
  .glow.a { background: var(--g); left: 12%; top: 25%; }
  .glow.b { background: var(--y); right: 12%; top: 35%; animation-delay: 3s; }
  .tag-line { color: #8a8a8a; font-weight: 300; letter-spacing: .25em; text-transform: uppercase; font-size: .8rem; opacity: 0; animation: fade 1.2s 2s forwards; }
  .tag-line b { color: var(--y); font-weight: 600; }
  .scroll { margin-top: 48px; width: 22px; height: 38px; border: 2px solid #444; border-radius: 14px; position: relative; opacity: 0; animation: fade 1s 2.4s forwards; }
  .scroll::after { content: ''; position: absolute; left: 50%; top: 7px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: var(--y); animation: wheel 1.6s infinite; }
  @keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes shine { to { background-position: -250% 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes pulse { 50% { transform: scale(1.25); opacity: .1; } }
  @keyframes wheel { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(14px); } }

  /* álbum */
  main { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 0 16px 120px; display: flex; flex-direction: column; gap: 56px; }
  .item { position: relative; background: #070707; border: 1px solid #1b1b1b; border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.9);
    opacity: 0; transform: translateY(90px) scale(.94); filter: blur(8px);
    transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1), filter .9s ease, box-shadow .4s, border-color .4s; }
  .item:nth-child(even) { transform: translateY(90px) scale(.94) rotate(.6deg); }
  .item:nth-child(odd) { transform: translateY(90px) scale(.94) rotate(-.6deg); }
  .item.in { opacity: 1; transform: none; filter: none; }
  .item:hover { border-color: #333; box-shadow: 0 30px 90px rgba(0,0,0,.9), 0 0 50px rgba(255,214,0,.06); }
  .item.main { border-color: rgba(255,214,0,.45); box-shadow: 0 0 80px rgba(255,214,0,.1), 0 30px 80px #000; }
  .item video, .item img { display: block; width: 100%; max-height: 82vh; object-fit: contain; background: #000; }
  .item img { cursor: zoom-in; transition: transform .8s; }
  .item:hover img { transform: scale(1.02); }
  .cap { padding: 14px 20px; font-size: .78rem; color: #777; display: flex; justify-content: space-between; align-items: center; letter-spacing: .12em; text-transform: uppercase; }
  .cap .n { color: #444; font-family: 'Anton'; font-size: 1.1rem; letter-spacing: .05em; }
  .tag { color: #000; background: var(--y); padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: .65rem; }
  .empty { text-align: center; color: #666; padding: 60px 0; }
  footer { position: relative; z-index: 2; text-align: center; padding: 30px 0 70px; font-family: 'Anton'; letter-spacing: .3em; color: #333; text-transform: uppercase; }
  footer small { display: block; margin-top: 14px; font-family: 'Inter', sans-serif; font-size: .6rem; letter-spacing: .1em; text-transform: none; color: #444; }
  #lb { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 30; display: none; align-items: center; justify-content: center; cursor: zoom-out; }
  #lb img { max-width: 96vw; max-height: 96vh; animation: fade .3s; }
  #lb.on { display: flex; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div class="flag" id="flag"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div id="bar"></div>
<header>
  <div class="glow a"></div><div class="glow b"></div>
  <div class="eyebrow">Álbum</div>
  <h1 id="title" aria-label="Calaram meu Nordeste"></h1>
  <div class="tag-line">Uma voz que <b>ninguém</b> vai calar</div>
  <div class="scroll"></div>
</header>
<main id="album"></main>
<footer>Calaram meu Nordeste<small>Developed by Josias Ataide, sem fins lucrativos</small></footer>
<div id="lb"><img alt=""></div>
<script>
// título animado letra por letra
(function () {
  const h = document.getElementById('title');
  let i = 0;
  ['Calaram meu', 'Nordeste'].forEach(txt => {
    const line = document.createElement('span');
    line.className = 'line';
    [...txt].forEach(c => {
      const s = document.createElement('span');
      s.className = 'ch' + (c === ' ' ? ' space' : '');
      s.textContent = c === ' ' ? '\u00a0' : c;
      s.style.setProperty('--i', i++);
      line.appendChild(s);
    });
    h.appendChild(line);
  });
  setTimeout(() => h.classList.add('shine'), 2500);
})();

const album = document.getElementById('album');
const lb = document.getElementById('lb');
lb.onclick = () => lb.classList.remove('on');
document.addEventListener('keydown', e => e.key === 'Escape' && lb.classList.remove('on'));

// barra de progresso + parallax
const bar = document.getElementById('bar'), flag = document.getElementById('flag');
function onScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
  flag.style.transform = `translateY(${-scrollY * .08}px) scale(${1 + scrollY / 12000})`;
}
addEventListener('scroll', onScroll, { passive: true }); onScroll();

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add('in');
  const v = e.target.querySelector('video');
  if (v && !e.isIntersecting && !v.paused) v.pause();
}), { threshold: .12 });

fetch('/api/media').then(r => { if (!r.ok || !(r.headers.get('content-type')||'').includes('json')) throw 0; return r.json(); })
  .catch(() => fetch('/media.json').then(r => r.json()))
  .then(items => {
  if (!items.length) { album.innerHTML = '<div class="empty">Coloque fotos e vídeos na pasta <b>midia</b> e recarregue.</div>'; return; }
  let firstVideo = true;
  items.forEach((it, idx) => {
    const d = document.createElement('div');
    d.className = 'item';
    let el;
    if (it.type === 'video') {
      el = document.createElement('video');
      el.src = it.url; el.controls = true; el.preload = 'metadata'; el.playsInline = true;
      if (firstVideo) { d.classList.add('main'); firstVideo = false; }
    } else {
      el = document.createElement('img');
      el.src = it.url; el.loading = 'lazy'; el.alt = it.name;
      el.onclick = () => { lb.querySelector('img').src = it.url; lb.classList.add('on'); };
    }
    const cap = document.createElement('div');
    cap.className = 'cap';
    const isMain = d.classList.contains('main');
    cap.innerHTML = `<span class="n">${String(idx + 1).padStart(2, '0')}</span><span>Calaram meu Nordeste</span>` + (isMain ? '<span class="tag">Principal</span>' : '<span></span>');
    d.append(el, cap);
    album.appendChild(d);
    io.observe(d);
  });
});
</script>
</body>
</html>
